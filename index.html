<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПЗ-5: DOM, события и интерактивность</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="status-panel">
        <h1>Статус работы</h1>
        <p class="status-text">Работа ещё не отмечена как выполненная.</p>

        <!-- Самостоятельная часть: выводим счётчик кликов на страницу -->
        <p class="click-counter">Количество кликов: <span class="click-count">0</span></p>

        <div class="buttons">
            <button class="status-button">Выполнено</button>
            <button class="reset-button">Сбросить</button>
            <!-- Самостоятельная часть: кнопка переключения темы -->
            <button class="theme-button">Сменить тему</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
